[project]
name = "upstream-processor"
version = "0.1.0"
description = "UpStream processor — supervisor + pluggable runtimes (M8.1: mock runtime only)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[project.scripts]
upstream-processor = "app.main:main"

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "ASYNC", "C4", "UP", "RUF", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

# The P2 in-container pyds app is bind-mounted into the DeepStream 8.0 +
# pyds container and runs there with `python3 -B`. It imports gi/pyds at
# module level (only resolvable inside the container), and it is not
# imported by any other `app/` code. Skip strict checking on this module.
[[tool.mypy.overrides]]
module = "app.runtimes.deepstream_runtime.pyds_metadata_app"
ignore_missing_imports = true
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
